# Public entry point for the multi-user bot console. The worker stays on
# loopback; nginx is the only internet-facing process. The worker authenticates
# each person and selects that person's own bot behind this one public URL.
#
# No nginx-level password: the worker's own account login (/account/login)
# guards every page and API except /api/health, so visitors land straight on
# the login page instead of getting a browser basic-auth prompt first.
#
# Install: cp this to /etc/nginx/sites-available/lfr-dashboard.conf,
# symlink into sites-enabled, remove the default site, reload nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/lfr-dashboard.access.log;
    error_log  /var/log/nginx/lfr-dashboard.error.log;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The worker already marks its own responses no-store; do not let a
        # proxy cache layer override that for status/health data.
        proxy_buffering off;
        proxy_cache off;
    }
}
