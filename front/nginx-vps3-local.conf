# Self-fronting for vps3 (172.237.2.229): TLS termination (self-signed,
# generated at deploy time — the original deploy/nginx-dashboard.conf never
# had TLS at all, plain HTTP on :80) + reverse proxy to the worker's own
# console on loopback. Same host as the backend (network_mode: host), so
# this reaches it over 127.0.0.1 — no tunnel, no separate edge host.

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;

	ssl_certificate     /etc/ssl/lfr/fullchain.pem;
	ssl_certificate_key /etc/ssl/lfr/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:lfr_tls:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	server_tokens off;
	autoindex off;
	client_max_body_size 1m;

	# No CSP here on purpose: the worker's server-rendered console sets its
	# own response headers, and a blanket policy would break its inline assets.
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

	location ~ /\. { return 404; }

	location / {
		proxy_pass http://127.0.0.1:8791;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;

		proxy_buffering off;
		proxy_cache off;
	}
}
